# The factory's own tests, the offline demo, and the dashboard with live
# measurements from this repository's pull requests. Runs on every push and PR,
# after every review of a PR, every hour, and by hand.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: ["earned-trust (reusable)", "earned-trust", "earned-trust (PR comments)", "earned-trust (PRs to main)", "reset demo PR", "earned-trust (line comments, answer)"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s factory/tests -t factory -v
      - name: Live measurements from this repository's pull requests
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 factory/et.py live
      - name: Offline demo (4 reviews, scripted receipts, benchmark, dashboard)
        run: python3 factory/et.py demo
      - name: Keep the dashboard for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard

  # The dashboard, public at https://<owner>.github.io/<repo>/, refreshed on main
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
