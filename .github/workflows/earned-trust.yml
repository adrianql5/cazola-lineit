# The Earned-Trust review, as a reusable workflow. A repository adds
# templates/earned-trust.yml to its .github/workflows and, from then on, every
# pull request gets a brief, a gate and (once signed) a receipt, by itself.
name: earned-trust (reusable)

on:
  workflow_call:
    inputs:
      factory_repo:
        type: string
        default: adrianql5/cazola-lineit
      factory_ref:
        type: string
        default: main
      issue_repo:
        description: where the issues the PRs implement live (empty = this repository)
        type: string
        default: ""
    secrets:
      LLM_BASE_URL:
        required: false
      LLM_API_KEY:
        required: false
      LLM_MODEL:
        required: false
      LLM_EXTRA_BODY:
        required: false

jobs:
  review:
    # PRs, and PR or line comments with a slash command in them
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/')) ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: earned-trust-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Get the factory
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          path: factory-src

      - name: Get the PR's code (to run the tests it adds)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          fetch-depth: 0  # MessagePack versions itself from git history (Nerdbank.GitVersioning)

      - name: .NET for the tests
        if: github.event_name == 'pull_request'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Review, replay the PR's commands, set the gate
        id: review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ET_ISSUE_REPO: ${{ inputs.issue_repo }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_EXTRA_BODY: ${{ secrets.LLM_EXTRA_BODY }}
        run: python3 factory-src/factory/et.py github ${{ github.event_name == 'pull_request' && '--target target' || '' }}

      - name: Keep the stage outputs and the receipt
        if: always() && steps.review.outputs.run_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: earned-trust-pr-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.run_id }}
          path: ${{ steps.review.outputs.run_dir }}
