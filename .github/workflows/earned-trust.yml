# Copy this file to .github/workflows/earned-trust.yml in the repository to review.
# Then, in Settings > Branches, require the check "earned-trust/human-accountability-gate".
name: earned-trust

on:
  pull_request:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  earned-trust:
    uses: adrianql5/cazola-lineit/.github/workflows/earned-trust.yml@main
    secrets: inherit
