# Slash commands on this repository's own example PRs (the four ju26-issue-*
# branches). Comment workflows always run from the default branch, so this one
# lives on main; the pull_request side lives on the ju26-base branch.
name: earned-trust (PR comments)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  earned-trust:
    uses: ./.github/workflows/earned-trust.yml
    secrets: inherit
