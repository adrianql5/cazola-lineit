# Slash commands written on this repository's PRs: comments on any PR, and
# replies on a finding's line for PRs to main. Comment workflows run from the
# default branch, so this one lives on main; the example PRs into ju26-base
# have their own pull_request workflow on that branch.
name: earned-trust (PR comments)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write     # to merge a signed PR when .earned-trust.toml asks for it (merge_on_sign)
  pull-requests: write
  issues: write
  checks: write
  actions: write      # to start ci after that merge (a merge made by the bot starts no workflow by itself)

jobs:
  earned-trust:
    uses: ./.github/workflows/earned-trust.yml
    secrets: inherit
