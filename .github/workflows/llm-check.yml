# Run by hand (Actions > llm-check > Run workflow): checks the LLM secrets
# work and lists the models the endpoint offers. Prints model names only.
name: llm-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: List the models
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.vultrinference.com/v1' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          echo "endpoint: $LLM_BASE_URL"
          [ -n "$LLM_API_KEY" ] && echo "key: set (${#LLM_API_KEY} characters)" || echo "key: NOT SET"
          python3 factory/et.py models
      - name: Real prosecutor prompt (#2283) per model and answer budget
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.vultrinference.com/v1' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          cd factory && python3 - <<'PY'
          import os, time
          from earned_trust import sources, classifier, prosecutor
          c = sources.load("ju26-issue-2283"); cl = classifier.run(c)
          for model, budget in [("deepseek-v4.1-flash-1017", "16000"), ("glm-5.3-flash", "16000"),
                                ("qwen3.8-27b", "16000"), ("glm-5.3", "16000")]:
              os.environ["LLM_MODEL"], os.environ["LLM_MAX_TOKENS"] = model, budget
              t = time.time()
              accs, meta = prosecutor.ask_llm(c, cl, offline=False)
              print(f"{model:26} budget={budget:>6} {time.time() - t:6.1f}s {meta.get('status')} "
                    f"accusations={len(accs)} {str(meta.get('why', ''))[:140]}")
              for a in accs[:3]:
                  print("     ", a.get("file"), a.get("line_start"), repr(a.get("symbol")), "|", (a.get("claim") or "")[:90])
          PY
