# Run by hand (Actions > reset demo PR > Run workflow) between demos: the PR's
# review starts again. A marker comment makes earlier commands stop counting
# (nothing is deleted), the gate goes back to "action required", and the saved
# AI answers are reused, so the findings stay the same.
name: reset demo PR

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request numbers, separated by spaces
        required: true
        default: "2 4 6 8 19 22"

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the review again
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          PRS: ${{ inputs.pr }}
        run: |
          for n in $PRS; do
            case "$n" in *[!0-9]*) echo "::error::'$n' is not a pull request number"; exit 1;; esac
            python3 factory/sancho.py github --reset "$n"
          done
